<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Repositories</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4 mt-4 border border-dark rounded-3">
  <div class="p-3  border border-dark mt-4 bg-primary rounded-3">
  <h2 class="text-center display-1 text-warning fw-bold ">Repositories</h2>
  </div>
  
  <!-- Filter + Sort Controls -->
  <div class="d-flex justify-content-between mb-3 mt-4">
    <input id="filterInput" type="text" class="form-control w-25" placeholder="Filter by repo name">
    <select id="sortSelect" class="form-select w-25">
      <option value="name">Name</option>
      <option value="stars">Stars</option>
      <option value="forks">Forks</option>
      <option value="issues">Open Issues</option>
    </select>
  </div>
  
<div class="table-responsive">
  <table class="table table-bordered table-hover table-striped mt-3 rounded-3 overflow-hidden ">
    <thead class="table-dark">
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Stars</th>
        <th>Forks</th>
        <th>Open Issues</th>
        <th>View</th>
      </tr>
    </thead>
    <tbody id="insertintable"></tbody>
  </table>
</div>



</div>


  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/repos.js"></script>
</body>
</html>
