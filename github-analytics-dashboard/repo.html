<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repository Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  
</head>
<body>
  <div class="container my-4">
    <div class="border border-dark p-3 rounded-3 bg-dark">
      <h2 id="repoName" class="text-center display-1 text-light fw-bold"></h2>
    </div>
    
    
    <!-- README Card -->
    <div class="card mb-4 mt-4">
      <div class="card-header bg-info text-white fw-bold text-center"> README</div>
      <div class="card-body" id="readme"></div>
    </div>
    
    <!-- Commits Card -->
    <div class="card  mb-4">
      <div class="card-header bg-success text-white fw-bold text-center"> Recent Commits</div>
      <div class="card-body">
        <ul id="commits" class="list-group list-group-flush list-unstyled"></ul>
      </div>
    </div>
    
    <!-- Personal Commits Card -->
    <div class="card  mb-4">
      <div class="card-header bg-secondary text-white fw-bold text-center"> Your Commits</div>
      <div class="card-body">
        <ul id="personalCommits" class="list-group list-group-flush list-unstyled"></ul>
      </div>
    </div>
    
    <!-- Issues Card -->
    <div class="card  mb-4">
      <div class="card-header bg-danger text-white fw-bold text-center"> Open Issues</div>
      <div class="card-body">
        <ul id="issues" class="list-group list-group-flush list-unstyled"></ul>
      </div>
    </div>
    
    <!-- Contributors Card -->
    <div class="card mb-4">
      <div class="card-header bg-warning text-dark fw-bold text-center">Contributors</div>
      <div class="card-body">
        <ul id="contributors" class="list-group list-group-flush list-unstyled"></ul>
      </div>
    </div>
    
    <!-- Commit History Graph Card -->
    <div class="card  mb-4">
      <div class="card-header bg-primary text-white fw-bold text-center"> Commit History (Last Year)</div>
      <div class="card-body">
        <canvas id="commitChart" width="400" height="200"></canvas>
      </div>
    </div>
    
    <div class="text-center mt-3">
      <a href="index.html" class="btn btn-dark w-100">Back to Search</a>
    </div>
  </div>

  <!-- Axios + Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> 
  <script src="js/repoDetail.js"></script>
</body>
</html>
